name: Enchantment
version: '${project.version}'
main: com.wafflegodxd.enchantment.EnchantmentPlugin
api-version: '1.21'
description: Lifesteal, but with XP levels. Kill a player to steal a level.
commands:
  enchantment:
    description: Check or manage enchantment levels
    usage: /<command> <check|set|reload>
permissions:
  enchantment.admin:
    description: Use /enchantment set and /enchantment reload
    default: op
