# ---------------------------------------------------------------- levels

# Level every player starts with (15 = gear tier 3)
start-level: 15

# Levels can never drop below this
min-level: 0

# Levels can never rise above this
max-level: 30

# Also give the killer 1 level straight away when they kill a player.
# Off by default: the dropped bottle is the reward.
kill-bonus: false

# Stop mobs, mining, smelting etc. from giving XP so bottles and potions are the only way to gain levels
block-xp-gain: true

# ------------------------------------------------------------- enchanting

# Enchantment table enchants scale with your level.
# Enchant level = your level / levels-per-tier (rounded down, at least 1).
# With 5: level 15 = tier 3, level 30 = tier 6 (Sharpness VI).
scale-enchants: true
levels-per-tier: 5

# Enchanting tables and anvils don't spend your levels
free-enchanting: true

# At the enchanting table, players at any-enchant-level or higher have a chance
# to also get an enchant that normally can't go on that item (Wind Burst on a sword).
# The extra enchant is capped at its normal max level. 0.5 = 50% chance.
any-enchant: true
any-enchant-level: 30
any-enchant-chance: 0.5

# ------------------------------------------------------ special enchants

# 10 custom enchants (Lifesteal, Frostbite, Executioner, Bloodrush, Static Shock,
# Second Wind, Nightsight, Springheel, Prospector, Snare). They never go above level II.
# Type /enchantment list in game to see what each one does.
special-enchants: true

# Chance that an enchanting table gives the item one special enchant that fits it.
# 0.3 = 30% chance.
special-chance: 0.3

# You need at least this level for the table to be able to roll a level II special enchant.
special-level-2-min-level: 25

# ---------------------------------------------------------------- gear lock

# Gear is locked by its highest enchantment level.
# You can only use gear whose tier is at or below your own tier
# (your level / levels-per-tier). Level 15 can't use a Sharpness VI sword
# (needs level 30) or wear Protection IV armor (needs level 20).
# Too-powerful armor is taken off, and weapons, tools, bows and tridents don't work.
gear-gating: true

# Also stop too-powerful gear from being picked up at all.
# Off by default: players can pick it up but can't use or wear it.
block-pickup: false

# ----------------------------------------------------------------- potion

# Craftable Potion of Levels: 2 gold ingots + 4 diamonds + 2 netherite ingots + 1 glass bottle
# (any arrangement on the crafting grid). Right-click it to gain potion-levels levels.
# Changing potion-recipe needs a full server restart.
potion-recipe: true
potion-levels: 2
